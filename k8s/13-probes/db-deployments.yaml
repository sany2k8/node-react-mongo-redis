# Step 13 — Mongo and Redis with exec probes
#
# Not everything speaks HTTP. Databases are the canonical `exec` probe case.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  namespace: node-react-mongo-redis
  labels:
    app: node-react-mongo-redis
    component: mongo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: node-react-mongo-redis
      component: mongo
  template:
    metadata:
      labels:
        app: node-react-mongo-redis
        component: mongo
    spec:
      containers:
        - name: mongo
          image: mongo:7.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: mongo
              containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef: { name: app-secret, key: MONGO_USER }
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: app-secret, key: MONGO_PASSWORD }

          # Mongo can take a while on first init (creating the root user,
          # preallocating journal files). A generous startup budget — 40 × 3s =
          # 120s — keeps liveness strict afterwards.
          startupProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - "db.adminCommand('ping')"
            periodSeconds: 3
            failureThreshold: 40
            timeoutSeconds: 5

          # NOTE: no credentials needed — `ping` is one of the few commands
          # allowed pre-auth. Deliberate: a probe that needs credentials is a
          # probe that breaks when you rotate them.
          livenessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - "db.adminCommand('ping')"
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - "db.adminCommand('ping')"
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 2

          volumeMounts:
            - name: data
              mountPath: /data/db
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mongo-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: node-react-mongo-redis
  labels:
    app: node-react-mongo-redis
    component: redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: node-react-mongo-redis
      component: redis
  template:
    metadata:
      labels:
        app: node-react-mongo-redis
        component: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          command: ["redis-server"]
          args: ["--requirepass", "$(REDIS_PASSWORD)", "--appendonly", "yes"]
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: app-secret, key: REDIS_PASSWORD }
          ports:
            - name: redis
              containerPort: 6379

          # redis-cli reads $REDISCLI_AUTH automatically — no password on the
          # command line, so it never lands in `describe pod` output or logs.
          # (`redis-cli -a <pass>` would leak it into the pod spec for anyone
          # with `get pod`.)
          startupProbe:
            exec:
              command: ["sh", "-c", 'REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
            periodSeconds: 2
            failureThreshold: 15

          livenessProbe:
            exec:
              command: ["sh", "-c", 'REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            exec:
              command: ["sh", "-c", 'REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2

          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 256Mi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: redis-data
