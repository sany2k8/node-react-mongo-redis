# Step 10b — Parallel Jobs (the work-queue pattern)
#
# completions = how many Pods must succeed in total
# parallelism = how many may run at once
#
# 6 completions / 2 parallelism = 3 waves of 2 pods.
apiVersion: batch/v1
kind: Job
metadata:
  name: parallel-demo
  namespace: node-react-mongo-redis
  labels:
    app: node-react-mongo-redis
    component: batch
spec:
  completions: 6
  parallelism: 2
  backoffLimit: 2
  ttlSecondsAfterFinished: 300

  # Indexed = each Pod gets a unique index 0..N-1 in the annotation
  # batch.kubernetes.io/job-completion-index and the JOB_COMPLETION_INDEX env
  # var. This is how you shard work deterministically without a queue: pod N
  # handles rows where id % 6 == N.
  #
  # NonIndexed (the default) = pods are interchangeable, you need a real work
  # queue (Redis, SQS) to hand out tasks.
  completionMode: Indexed

  template:
    spec:
      restartPolicy: Never
      containers:
        - name: worker
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "worker for shard ${JOB_COMPLETION_INDEX} starting on $(hostname)"
              sleep 3
              echo "shard ${JOB_COMPLETION_INDEX} done"
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 50m, memory: 32Mi }
