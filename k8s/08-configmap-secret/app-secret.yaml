# Step 8 — Secret
#
# ############################################################################
# #  READ THIS. base64 IS NOT ENCRYPTION. It is encoding — trivially           #
# #  reversible by anyone who can read the file:                               #
# #                                                                            #
# #      echo 'czNjcjN0LXBAc3M=' | base64 -d   ->  s3cr3t-p@ss                #
# #                                                                            #
# #  A Secret's ONLY real advantages over a ConfigMap are:                     #
# #    - it can be RBAC'd separately                                           #
# #    - it's kept in tmpfs (RAM) when mounted, never written to node disk     #
# #    - kubectl/kubectl describe won't echo the values by accident            #
# #    - it CAN be encrypted at rest, if the cluster enables EncryptionConfig  #
# #                                                                            #
# #  THIS FILE IS A TEACHING ARTIFACT. Never commit real credentials in one.   #
# #  See the README for `kubectl create secret`, SOPS, Sealed Secrets, and     #
# #  External Secrets Operator — the ways you do this for real.                #
# ############################################################################
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: node-react-mongo-redis
  labels:
    app: node-react-mongo-redis
type: Opaque

# stringData takes PLAINTEXT and the API server base64-encodes it for you.
# It's write-only: read the Secret back and you'll see `data` with base64.
# (Use `data:` instead if you want to supply already-base64 values.)
stringData:
  # Note the '@' — it is a URL delimiter in a mongodb:// connection string.
  # The backend runs these through encodeURIComponent(), so it becomes
  # mongodb://appuser:s3cr3t-p%40ss@mongo:27017/?authSource=admin
  # A naive string concat would produce a broken URL. This password is chosen
  # deliberately to prove the escaping works.
  MONGO_USER: "appuser"
  MONGO_PASSWORD: "s3cr3t-p@ss"
  REDIS_PASSWORD: "r3d1s-s3cr3t"
