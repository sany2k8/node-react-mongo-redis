# Step 8 — Mongo, now with authentication
#
# The mongo image creates a root user from MONGO_INITDB_ROOT_USERNAME/PASSWORD
# and enables --auth. CRITICAL: this only happens on the FIRST start with an
# EMPTY data directory. Point it at a volume that already has data and these
# variables are silently ignored — a classic "why won't my password work" bug.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  namespace: node-react-mongo-redis
  labels:
    app: node-react-mongo-redis
    component: mongo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: node-react-mongo-redis
      component: mongo
  template:
    metadata:
      labels:
        app: node-react-mongo-redis
        component: mongo
    spec:
      containers:
        - name: mongo
          image: mongo:7.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: mongo
              containerPort: 27017
          env:
            # secretKeyRef pulls ONE key and can rename it. The mongo image wants
            # MONGO_INITDB_ROOT_USERNAME; our Secret calls it MONGO_USER.
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: MONGO_USER
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: MONGO_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /data/db
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          emptyDir: {} # still ephemeral — step 9 fixes this
