name: Build and Push to GHCR

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      # The immutable tag the chart will pin to.
      sha_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # `main` stays as a convenience pointer, but the short SHA is what the
          # chart pins: a mutable tag gives ArgoCD nothing to notice, so the
          # cluster would never roll. Order matters — the first tag becomes
          # steps.meta.outputs.version, which the bump-chart job consumes.
          tags: |
            type=sha,format=short,prefix=
            type=raw,value=main,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Surfaces at GET /api/ so you can see which build is live.
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}

  bump-chart:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the chart repo
        uses: actions/checkout@v4
        with:
          repository: sany2k8/nrmr-chart
          token: ${{ secrets.CHART_REPO_TOKEN }}

      - name: Point dev at the new image
        env:
          TAG: ${{ needs.build-and-push.outputs.sha_tag }}
        run: |
          yq -i '.app.image.tag = strenv(TAG)' values-dev.yaml
          git config user.name  "sany2k8"
          git config user.email "sany2k8@gmail.com"
          if git diff --quiet; then
            echo "values-dev.yaml already on $TAG — nothing to do"
            exit 0
          fi
          git commit -am "chore(dev): deploy $TAG"
          git push
